[project]
name = "zalo-bot-mcp"
version = "0.1.0"
description = "MCP channel server for Zalo Bot API — bridges Zalo messages into an MCP client session"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["zalo", "mcp", "chatbot", "channel"]

dependencies = [
    "httpx>=0.27,<0.29",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
zalo-bot-mcp = "zalo_bot_mcp.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zalo_bot_mcp"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
