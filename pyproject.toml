[project]
name = "zalo-bot-mcp"
version = "0.1.1"
description = "MCP channel server for the Zalo Bot API. Bridges Zalo messages into an MCP client session."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "trongnguyenbinh" }]
keywords = ["zalo", "mcp", "chatbot", "channel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "httpx>=0.27,<0.29",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/trongnguyenbinh/zalo-bot-mcp"
Repository = "https://github.com/trongnguyenbinh/zalo-bot-mcp"
Issues = "https://github.com/trongnguyenbinh/zalo-bot-mcp/issues"

[project.scripts]
zalo-bot-mcp = "zalo_bot_mcp.main:run"
zalo-bot-mcp-admin = "zalo_bot_mcp.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zalo_bot_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [".claude/settings.local.json"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# hatchling's editable install writes _editable_impl_*.pth, which Python 3.14
# ignores (underscore-prefixed .pth files are skipped since 3.14) — put src on
# the path directly so tests don't depend on the editable-install mechanism.
pythonpath = ["src"]
