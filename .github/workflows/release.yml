name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The tag, pyproject.toml and plugin.json must agree on one version.
      # Stop here if they do not.
      - name: Check version consistency
        run: |
          python - <<'EOF'
          import json, os, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          proj = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          plugin = json.load(open(".claude-plugin/plugin.json"))["version"]
          if not tag == proj == plugin:
              sys.exit(f"version mismatch: tag={tag} pyproject={proj} plugin.json={plugin}")
          print(f"version {tag} ok")
          EOF

      # CI fires on branch pushes and PRs only, so a tag can point at a commit
      # that never ran the suite. Re-run it here: PyPI never lets a version
      # number be reused, so a bad publish is permanent.
      - run: python -m pip install -e ".[dev]" build
      - run: ruff check .
      - run: pytest -q

      - run: python -m build

      # Every gate above runs against the source tree; nothing has opened the
      # wheel yet. Not even pytest: pyproject sets pythonpath = ["src"], so the
      # suite imports straight from src rather than through an installed
      # package, and the plugin path runs uvx --from <dir>, which never touches
      # the wheel either. Installing into a clean venv is the only place a
      # packaging bug shows up: a missing module, a broken entry point, a
      # dependency that was never declared.
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/smoke-wheel
          /tmp/smoke-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/smoke-wheel/bin/python -c "import zalo_bot_mcp"
          /tmp/smoke-wheel/bin/zalo-bot-mcp-admin --help > /dev/null
          test -x /tmp/smoke-wheel/bin/zalo-bot-mcp

      # An sdist can quietly ship the wrong file set. Installing from it proves
      # it still builds and that nothing was left out.
      - name: Smoke test the sdist
        run: |
          python -m venv /tmp/smoke-sdist
          /tmp/smoke-sdist/bin/python -m pip install --disable-pip-version-check dist/*.tar.gz
          /tmp/smoke-sdist/bin/python -c "import zalo_bot_mcp"
          /tmp/smoke-sdist/bin/zalo-bot-mcp-admin --help > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing; no API token stored anywhere
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
